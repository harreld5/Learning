<style>
:root {
  --bg: #F4F7F5; --card: #FFFFFF; --ink: #17211B; --muted: #5E6B63; --line: #DCE4DF;
  --brand: #1F8A4C; --brand-ink: #FFFFFF; --soft: #E7F3EC;
  --ok: #1F8A4C; --ok-bg: #E3F4EA; --bad: #C0362C; --bad-bg: #FBE7E5; --warn: #A86A00;
  --p: #3A6FD8; --c: #D98B1E; --f: #9B4DC9; --cal: #1F8A4C;
  --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 10px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1512; --card: #18201C; --ink: #E8EFEA; --muted: #9AA8A0; --line: #2A3530;
    --brand: #35B06A; --brand-ink: #06140C; --soft: #1C2E24;
    --ok: #46C27C; --ok-bg: #16301F; --bad: #FF7A6E; --bad-bg: #3A1B18; --warn: #F0B04A;
    --p: #7AA2F7; --c: #F0B04A; --f: #C792EA; --cal: #46C27C; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1512; --card: #18201C; --ink: #E8EFEA; --muted: #9AA8A0; --line: #2A3530;
  --brand: #35B06A; --brand-ink: #06140C; --soft: #1C2E24;
  --ok: #46C27C; --ok-bg: #16301F; --bad: #FF7A6E; --bad-bg: #3A1B18; --warn: #F0B04A;
  --p: #7AA2F7; --c: #F0B04A; --f: #C792EA; --cal: #46C27C; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%;
  padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 8px; display: flex; align-items: center; gap: 8px; }
header h1 { font-size: 22px; margin: 0; flex: 1; }
main { padding: 0 16px 16px; max-width: 640px; margin: 0 auto; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 14px; margin: 0 0 12px; }
.card h2 { font-size: 17px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { border: 0; border-radius: 12px; padding: 11px 14px; background: var(--brand); color: var(--brand-ink); font-weight: 600; }
.btn.alt { background: var(--soft); color: var(--ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.sm { padding: 7px 10px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
.icon-btn { border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; color: var(--muted); font-size: 18px; }
input[type=text], input[type=number], input[type=search], select {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
label.field { display: block; font-size: 13px; color: var(--muted); }
label.field > input, label.field > select { margin-top: 4px; font-size: 16px; color: var(--ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; white-space: nowrap; font-size: 14px; }
.chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

/* macro bars */
.macro { margin: 8px 0; }
.macro .top { display: flex; justify-content: space-between; font-size: 14px; }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; border-radius: 99px; }
.bar > i.over { background: var(--bad) !important; }
.big-left { font-size: 30px; font-weight: 700; }

/* verdict */
.verdict { border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 10px; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); }
.verdict.bad { background: var(--bad-bg); color: var(--bad); }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.reasons { margin: 8px 0 0; padding-left: 20px; font-size: 14px; }
.nut { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin: 10px 0; }
.nut div { background: var(--bg); border-radius: 10px; padding: 8px 4px; }
.nut b { display: block; font-size: 18px; }
.nut span { font-size: 12px; color: var(--muted); }

/* lists */
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.item .meta { font-size: 13px; color: var(--muted); }
.tap { cursor: pointer; }
.item input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--brand); flex: none; }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; }

/* scanner */
.scanbox { position: relative; background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 3; }
.scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanbox .guide { position: absolute; left: 10%; right: 10%; top: 32%; bottom: 32%; border: 3px solid rgba(255,255,255,.85); border-radius: 12px; box-shadow: 0 0 0 999px rgba(0,0,0,.25); }
.scanbox .idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; text-align: center; padding: 20px; }

/* nav */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; border: 0; background: transparent; padding: 8px 0 7px; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav button.on { color: var(--brand); font-weight: 700; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card { background: var(--card); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.sheet-head h2 { margin: 0; font-size: 19px; flex: 1; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; }
.stepper input { width: 64px; text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 30;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; max-width: 90vw; }
.meal h3 { margin: 0; font-size: 15px; }
details summary { cursor: pointer; font-weight: 600; }
.switch { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.switch:first-of-type { border-top: 0; }
.switch input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--brand); }
.switch input[type=number] { width: 90px; }
</style>
</head>

function verdict(f) {

let scan = { active: false, stream: null, reader: null, timer: 0, busy: false };
function renderScan() {
  $('#view').innerHTML = `<div class="scanbox" id="scanbox"><video id="video" playsinline muted></video><div class="guide" id="guide" hidden></div>
      <div class="idle" id="scan-idle"><div style="font-size:15px">Point the camera at the barcode on the package.</div>
      <button class="btn" data-act="startscan">Start camera</button></div></div>
    <div class="row" style="margin:10px 0 14px"><button class="btn ghost sm" data-act="stopscan" id="stopbtn" hidden>Stop camera</button>
      <span class="small muted grow" id="scan-status"></span></div>
    <div class="card"><h2>Type the barcode</h2><div class="row"><input type="text" inputmode="numeric" id="manual-code" placeholder="e.g. 096619123456" autocomplete="off">
      <button class="btn" data-act="lookup">Look up</button></div>
      <div class="small muted" style="margin-top:6px">Nutrition comes from Open Food Facts, a free public food database. Only the barcode number is sent.</div></div>
    <div class="card"><h2>No barcode?</h2><div class="row"><button class="btn alt grow" data-act="find">Search by name</button><button class="btn alt grow" data-act="newfood">Enter label</button></div></div>`;
  if (S.camOk) startScan();
}
async function startScan() {
  stopScan();
  const video = $('#video'); if (!video) return;
  const status = msg => { const el = $('#scan-status'); if (el) el.textContent = msg; };
  scan.active = true; scan.busy = false;
  $('#scan-idle').hidden = true; $('#guide').hidden = false; $('#stopbtn').hidden = false;
  status('Starting camera…');
  const constraints = { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
  try {
    let native = null;
    if ('BarcodeDetector' in window) {
      try {
        const fm = await BarcodeDetector.getSupportedFormats();
        const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e'].filter(x => fm.includes(x));
        if (want.length) native = new BarcodeDetector({ formats: want });
      } catch (e) {}
    }
    if (native) {
      scan.stream = await navigator.mediaDevices.getUserMedia(constraints);
      if (!scan.active) return stopScan();
      video.srcObject = scan.stream; await video.play();
      const tick = async () => {
        if (!scan.active) return;
        try { const r = await native.detect(video); if (r.length) return onCode(r[0].rawValue); } catch (e) {}
        scan.timer = setTimeout(tick, 180);
      };
      tick();
    } else {
      await loadZxing();
      if (!scan.active) return;
      const hints = new Map();
      const F = ZXing.BarcodeFormat;
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E]);
      scan.reader = new ZXing.BrowserMultiFormatReader(hints, 200);
      await scan.reader.decodeFromConstraints(constraints, video, res => { if (res && scan.active) onCode(res.getText()); });
    }
    S.camOk = true; save();
    status('Scanning… hold steady about 6 inches away.');
  } catch (e) {
    stopScan();
    status(e && e.name === 'NotAllowedError' ? 'Camera blocked. Allow camera access for this app in your phone settings, or type the barcode below.'
      : 'Could not start the camera. You can type the barcode below.');
  }
}
let zxingLoading;
function loadZxing() {
  if (window.ZXing) return Promise.resolve();
  return zxingLoading = zxingLoading || new Promise((ok, no) => {
    const s = document.createElement('script'); s.src = 'vendor/zxing.min.js'; s.onload = ok; s.onerror = () => { zxingLoading = null; no(new Error('load')); };
    document.head.appendChild(s);
  });
}
function stopScan() {
  scan.active = false; clearTimeout(scan.timer);
  try { scan.reader && scan.reader.reset(); } catch (e) {}
  scan.reader = null;
  if (scan.stream) scan.stream.getTracks().forEach(t => t.stop());
  scan.stream = null;
  const v = $('#video'); if (v) { v.srcObject = null; }
  if ($('#scan-idle')) { $('#scan-idle').hidden = false; $('#guide').hidden = true; $('#stopbtn').hidden = true; }
}
function onCode(code) {
  if (scan.busy) return; scan.busy = true;
  if (navigator.vibrate) navigator.vibrate(60);
  stopScan();
  lookupBarcode(code);
}

/* ---------- Open Food Facts lookup ---------- */
const OFF_FIELDS = 'code,product_name,brands,serving_size,serving_quantity,nutriments,image_front_small_url';
async function offFetch(url) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok && r.status !== 404) throw new Error('http ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function codeVariants(code) {
  const c = String(code).replace(/\D/g, ''); const v = [c];
  if (c.length === 12) v.push('0' + c);
  if (c.length === 13 && c[0] === '0') v.push(c.slice(1));
  return v;
}
async function lookupBarcode(raw) {
  const code = String(raw || '').replace(/\D/g, '');
  if (code.length < 6) { toast('That barcode looks too short'); return; }
  const saved = S.foods['b' + code] || allFoods().find(f => f.barcode === code);
  if (saved) return openFood(saved.id);
  sheet(`<div class="sheet-head"><h2>Looking up ${esc(code)}…</h2></div><div class="empty">Checking the food database.</div>`);
  try {
    for (const c of codeVariants(code)) {
      const d = await offFetch(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=${OFF_FIELDS}`);
      if (d && d.status === 1 && d.product) {
        const f = fromOFF(code, d.product);
        S.foods[f.id] = f; save();
        return openFood(f.id);
      }
    }
    sheet(`<div class="sheet-head"><h2>Not in the database</h2><button class="icon-btn" data-act="close">✕</button></div>
      <p>Barcode <b>${esc(code)}</b> wasn't found. Enter the numbers from the Nutrition Facts label once and the app will remember it.</p>
      <button class="btn block" data-act="newfood" data-code="${esc(code)}">Enter label</button>`);
  } catch (e) {
    sheet(`<div class="sheet-head"><h2>Couldn't reach the food database</h2><button class="icon-btn" data-act="close">✕</button></div>
      <p class="muted">Check your internet connection and try again, or enter the label yourself.</p>
      <div class="row"><button class="btn grow" data-act="lookup" data-code="${esc(code)}">Try again</button>
      <button class="btn alt grow" data-act="newfood" data-code="${esc(code)}">Enter label</button></div>`);
  }
}
function fromOFF(code, p) {
  const n = p.nutriments || {};
  const sq = parseFloat(p.serving_quantity) || 0;
  const num = v => (v === undefined || v === null || v === '' || isNaN(+v)) ? null : +v;
  const hasServing = num(n['energy-kcal_serving']) != null || num(n.proteins_serving) != null || sq > 0;
  const per = k => {
    const s = num(n[k + '_serving']); if (s != null) return s;
    const h = num(n[k + '_100g']); if (h == null) return null;
    return hasServing && sq ? h * sq / 100 : h;
  };
  let cal = per('energy-kcal');
  if (cal == null) { const kj = per('energy'); if (kj != null) cal = kj / 4.184; }
  return {
    id: 'b' + code, barcode: code, src: 'scan', cat: 'other',
    name: (p.product_name || '').trim() || 'Unnamed product', brand: (p.brands || '').split(',')[0].trim(),
    serving: hasServing ? (p.serving_size || (sq + ' g')) : '100 g', noServing: !hasServing,
    cal: cal == null ? null : r1(cal), p: r1n(per('proteins')), c: r1n(per('carbohydrates')), f: r1n(per('fat')),
    sf: r1n(per('saturated-fat')), s: r1n(per('sugars')), fb: r1n(per('fiber')), img: p.image_front_small_url || '',
  };
}
function r1n(v) { return v == null ? null : r1(v); }

function planPool() {

function weightedPick(arr, used) {
  if (!arr.length) return null;
  const w = arr.map(f => 1 / (1 + 2 * (used[f.id] || 0)) * (0.6 + Math.random()));
  let best = 0; for (let i = 1; i < w.length; i++) if (w[i] > w[best]) best = i;
  return arr[best];
}
function makeDay(pool, used) {
  const by = (cats, meal) => pool.filter(f => cats.includes(f.cat) && mealsFor(f).includes(meal));
  const pf = S.planOpts.pf;
  // Protein-forward: breakfast can stack a second protein, and snacks are protein snacks.
  const slots = [
    ['Breakfast', pf ? [['bprotein', 'protein'], ['carb', 'fruit'], ['bprotein', 'optional']] : [['bprotein', 'protein'], ['carb', 'fruit']]],
    ['Lunch', [['protein'], ['carb'], ['veg'], ['fat']]],
    ['Dinner', [['protein'], ['carb'], ['veg'], ['fat']]],
  ];
  for (let i = 0; i < S.planOpts.snacks; i++) slots.push(['Snacks', pf ? [['snack', 'bprotein', 'protein', 'highprotein']] : [['snack', 'bprotein', 'fruit', 'fat']]]);
  const meals = [];
  for (const [meal, parts] of slots) {
    const code = meal[0].toLowerCase();
    const items = [];
    for (const cats of parts) {
      const optional = cats.includes('optional');
      const options = by(cats, code).filter(f => !items.some(x => x.id === f.id) && (!cats.includes('highprotein') || isHighProtein(f)));
      const choice = weightedPick(options, used);
      if (!choice) continue;
      used[choice.id] = (used[choice.id] || 0) + 1;
      const c = CATS[choice.cat] || CATS.other;
      items.push({ id: choice.id, sv: optional ? 0 : 1, step: choice.whole ? 1 : 0.5, min: optional || c.min === 0 ? 0 : (choice.whole ? 1 : 0.5), max: c.max });
    }
    let m = meals.find(x => x.meal === meal);
    if (m) m.items.push(...items); else if (items.length) meals.push({ meal, items });
  }
  optimize(meals, pf);
  for (const m of meals) m.items = m.items.filter(x => x.sv > 0);

// Share of daily protein each meal should carry in protein-forward plans.
function proteinShares(meals) {
  const hasSnack = meals.some(m => m.meal === 'Snacks');
  return hasSnack ? { Breakfast: 0.25, Lunch: 0.3, Dinner: 0.3, Snacks: 0.15 } : { Breakfast: 0.3, Lunch: 0.35, Dinner: 0.35 };
}
function optimize(meals, pf) {
  const T = S.targets, W = { cal: 3, p: 3, c: 1, f: 1 };
  const items = meals.flatMap(m => m.items), shares = proteinShares(meals);
  const sum = (list, k) => list.reduce((a, x) => a + (getFood(x.id)[k] || 0) * x.sv, 0);
  const err = () => {
    let e = 0;
    for (const k in W) {
      const d = (sum(items, k) - T[k]) / (T[k] || 1);
      // Protein-forward: falling short on protein costs far more than going over.
      // Carbs and fat are ceilings: going over costs far more than coming in under.
      const w = k === 'p' ? (pf ? (d < 0 ? 8 : 1) : W.p) : k === 'c' ? (d > 0 ? 12 : 1) : k === 'f' ? (d > 0 ? 5 : 1) : W[k];
      e += w * d * d;
    }
    const sfOver = sum(items, 'sf') - sfTarget();
    if (sfOver > 0) e += 10 * (sfOver / sfTarget()) ** 2;
    if (pf) for (const m of meals) {
      const want = T.p * (shares[m.meal] || 0) * 0.9, got = sum(m.items, 'p');
      if (want && got < want) e += 3 * ((want - got) / want) ** 2;
    }
    return e;
  };
  let e = err();
  for (let it = 0; it < 400; it++) {
    let best = null, be = e;
    for (const x of items) for (const d of [x.step, -x.step]) {
      const nv = x.sv + d; if (nv < x.min - 1e-9 || nv > x.max + 1e-9) continue;
      x.sv = nv; const ne = err(); x.sv -= d;
      if (ne < be - 1e-9) { be = ne; best = [x, d]; }

}
function generatePlan() {
  const pool = planPool();
  const used = {};

/* Setup code: MC1-sex-age-lb-ft-in-activity-goal-flags  e.g. MC1-m-39-256-5-5.75-1.375-lose-ptn

function applySetupCode(raw) {
  const parts = String(raw || '').trim().replace(/\s+/g, '').split('-');
  const [tag, sex, age, lb, ft, inch, act, goal, flags = ''] = parts;
  const ok = /^mc1$/i.test(tag) && /^[mf]$/i.test(sex) && +age > 0 && +lb > 0 && ft !== '' && +act > 1 && ['lose', 'keep', 'gain'].includes((goal || '').toLowerCase());
  if (!ok) { toast('That setup code doesn’t look right — check it and try again'); return; }
  Object.assign(S.calc, { sex: sex.toLowerCase(), age: +age, lb: +lb, ft: +ft, inch: +inch || 0, act: +act, goal: goal.toLowerCase(),
    pf: flags.includes('p'), tg: flags.includes('t') });
  S.rules.net = flags.includes('n');
  calcGoals();
  const T = S.targets;
  toast(`All set: ${T.cal} cal · P${T.p} C${T.c} F${T.f}`);
}
function calcGoals() {
  const c = S.calc, kg = c.lb * 0.4536, cm = (c.ft * 12 + +c.inch) * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * c.age + (c.sex === 'm' ? 5 : -161);
  let cal = bmr * c.act; cal += c.goal === 'lose' ? -500 : c.goal === 'gain' ? 300 : 0;
  cal = Math.max(1200, Math.round(cal / 10) * 10);
  // At higher body weights, base protein on adjusted body weight (ideal weight + 40% of the difference).
  const inches = c.ft * 12 + +c.inch, bmi = kg / (cm / 100) ** 2;
  const ibw = (c.sex === 'm' ? 50 : 45.5) + 2.3 * Math.max(0, inches - 60);
  const refLb = (bmi >= 30 ? ibw + 0.4 * (kg - ibw) : kg) * 2.2046;
  let p = Math.round(refLb * (c.goal === 'keep' ? 0.8 : 0.9));
  if (c.pf) p = Math.max(p, Math.round(cal * 0.35 / 4 / 5) * 5); // protein-forward: at least 35% of calories
  let f, carbs;
  if (c.tg) { // high triglycerides / low HDL: cut carbs, make up the rest with (mostly unsaturated) fat
    carbs = Math.round(cal * 0.34 / 4 / 5) * 5; f = Math.round((cal - p * 4 - carbs * 4) / 9);
  } else {
    f = Math.round(cal * 0.28 / 9); carbs = Math.max(50, Math.round((cal - p * 4 - f * 9) / 4));
  }
  const sf = Math.round(cal * (c.tg ? 0.07 : 0.1) / 9);
  S.targets = { cal, p, c: carbs, f, sf }; S.targetsSet = true; autoRules();
  // High triglycerides: judge fat by saturated fat only, so salmon, nuts and olive oil aren't blocked by total fat.
  if (c.tg) S.rules.f.on = false; save(); renderSettings();
  toast(`Goals set: ${cal} cal · P${p} C${carbs} F${f}`);
}
function autoRules() {
  const n = Math.max(1, S.servingsPerDay), T = S.targets;
  S.rules.cal.v = Math.round(T.cal / n); S.rules.c.v = Math.round(T.c / n); S.rules.f.v = Math.round(T.f / n);
  S.rules.sf.v = Math.round(sfTarget() / n * 2) / 2;
}
function exportBackup() {

    case 'unlog': S.log[viewDay] = entries(viewDay).filter(x => x.id !== id); save(); renderToday(); break;
    case 'find': findSheet(); break;

    case 'newfood': foodForm(null, el.dataset.code); break;

    case 'exclude': {

    case 'cfilter': costcoFilter = el.dataset.v; renderCostco(); break;
    case 'cleargot': for (const k in S.list) if (S.list[k].got) delete S.list[k]; save(); renderCostco(); break;
    case 'clearlist': if (confirm('Clear your whole shopping list?')) { S.list = {}; save(); renderCostco(); } break;
    case 'pdays': S.planOpts.days = +el.dataset.v; save(); renderPlan(); break;
    case 'psnacks': S.planOpts.snacks = +el.dataset.v; save(); renderPlan(); break;
    case 'genplan': generatePlan(); renderPlan(); break;
    case 'pday': planDay = +el.dataset.v; renderPlan(); break;
    case 'logmeal': {
      const m = S.plan.days[planDay].meals[+el.dataset.m];
      for (const x of m.items) logFood(getFood(x.id), x.sv, m.meal, todayKey());
      toast(`${m.meal} logged for today`); break;
    }
    case 'plan2list': {
      const need = {};
      for (const d of S.plan.days) for (const m of d.meals) for (const x of m.items) need[x.id] = (need[x.id] || 0) + x.sv;
      for (const [fid, n] of Object.entries(need)) S.list[fid] = { on: true, got: false, need: n };
      save(); toast(`${Object.keys(need).length} items on your shopping list`); costcoView = 'list'; go('costco'); break;
    }
    case 'calc': calcGoals(); break;
    case 'setupcode': applySetupCode($('#setupcode').value); break;
    case 'autorules': { S.servingsPerDay = Math.max(1, Math.round(+$('#spd').value || 5)); autoRules(); save(); renderSettings(); toast('Per-serving limits updated'); break; }
    case 'export': exportBackup(); break;
    case 'reset': if (confirm('Erase all goals, logs, saved foods and lists from this phone?')) { localStorage.removeItem(KEY); S = load(); render(); } break;
  }
});
document.addEventListener('change', e => {
  const el = e.target; if (!el.matches('input[type=checkbox][data-act]')) return;
  const id = el.dataset.id;
  if (el.dataset.act === 'listtoggle') { if (el.checked) S.list[id] = { on: true, got: false }; else delete S.list[id]; save(); }
  if (el.dataset.act === 'got' && S.list[id]) { S.list[id].got = el.checked; save(); renderCostco(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'manual-code') lookupBarcode(e.target.value); });
document.addEventListener('visibilitychange', () => { if (document.hidden && scan.active) stopScan(); });

render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // When a new version installs, reload once so it shows right away.
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
}
</script>
</body>
